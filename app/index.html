<style>
html{-webkit-text-size-adjust:100%;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: cabecera con vistas Día / Semana / Mes sobre fondo beige; contenido en tarjetas blancas.
   Rojo = pendiente, verde = hecha. El color de asignatura solo aparece en etiquetas y bloques. */
:root{
  --bg:#F4EEE2;
  --surface:#FFFFFF;
  --surface-2:#FAF6EE;
  --line:#E4D9C3;
  --fg:#2A251D;
  --muted:#7B7263;
  --pend:#C0443A;
  --pend-ink:#A5342B;
  --done:#2E8B57;
  --done-ink:#1D6B40;
  --wait:#E0A126;
  --wait-ink:#9A6A0B;
  --on-mix:#000000;
  --k-verde:#74AA4F;
  --k-azul:#4C84CC;
  --k-lila:#8F70C8;
  --k-amarillo:#D6AA18;
  --k-rosa:#E5818F;
  --k-naranja:#E28D44;
  --k-turquesa:#32A39F;
  --k-gris:#91897B;
  --pend-bg:color-mix(in srgb,var(--pend) 13%,var(--surface));
  --done-bg:color-mix(in srgb,var(--done) 14%,var(--surface));
  --c:var(--k-gris);
  --shadow:0 12px 40px rgba(60,45,20,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1814;--surface:#25211C;--surface-2:#2C2721;--line:#3B352C;--fg:#F2EBDD;--muted:#A89F8F;
    --pend:#E8776C;--pend-ink:#F4A097;--done:#5CC389;--done-ink:#86D9AB;--wait:#EBB84A;--wait-ink:#EBB84A;--on-mix:#FFFFFF;
    --k-verde:#8CC46C;--k-azul:#6AA0E6;--k-lila:#A98BE0;--k-amarillo:#E3BE3F;--k-rosa:#F0A0AB;--k-naranja:#EFA564;--k-turquesa:#5CC4C0;--k-gris:#A8A296;
    --shadow:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1814;--surface:#25211C;--surface-2:#2C2721;--line:#3B352C;--fg:#F2EBDD;--muted:#A89F8F;
  --pend:#E8776C;--pend-ink:#F4A097;--done:#5CC389;--done-ink:#86D9AB;--wait:#EBB84A;--wait-ink:#EBB84A;--on-mix:#FFFFFF;
  --k-verde:#8CC46C;--k-azul:#6AA0E6;--k-lila:#A98BE0;--k-amarillo:#E3BE3F;--k-rosa:#F0A0AB;--k-naranja:#EFA564;--k-turquesa:#5CC4C0;--k-gris:#A8A296;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);
  font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
}
.shell{max-width:1120px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
h1,h2,p{margin:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* Cabecera */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.brand h1{font-size:28px;font-weight:700;letter-spacing:-.015em;line-height:1.1}
.period{margin-top:4px;color:var(--muted);font-weight:500}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:7px 14px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg.wide{display:flex}
.seg.wide button{flex:1}
.nav{display:inline-flex;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.primary{background:var(--fg);color:var(--bg);border-radius:10px;padding:9px 16px;font-weight:700}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600}
.ghost.sm{padding:5px 11px;font-size:13px}
.danger{color:var(--pend-ink);border-color:color-mix(in srgb,var(--pend) 40%,var(--line))}
.danger.armed{background:var(--pend);color:#fff;border-color:var(--pend)}

.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.lg{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.lg[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:var(--c)}
.notice{font-size:13px;color:var(--muted);margin-bottom:12px}
.badge.alt{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
/* Notas */
.notas{display:grid;gap:14px}
.gfields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.gf{display:flex;flex-direction:column;gap:4px;min-width:0}
.gf>span{font-size:12px;font-weight:600;color:var(--muted)}
.gf-wide{grid-column:1/-1}
.gerr{color:var(--pend-ink);font-weight:600;margin:10px 0 0}
.gbtns{display:flex;gap:8px;margin-top:12px}
.ghead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.gtitle{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}
.gbig{text-align:right;line-height:1.1}
.gbig b{display:block;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--pend-ink)}
.gbig.ok b{color:var(--done-ink)}
.gbig small{font-size:12px;color:var(--muted);font-weight:500}
.gchip{margin:10px 0;padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600}
.gchip.ok{background:var(--done-bg);color:var(--done-ink)}
.gchip.bad{background:var(--pend-bg);color:var(--pend-ink)}
.gextra{color:var(--muted);font-size:14px;margin:10px 0 0}
.glist{margin-top:10px}
.grow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.gedit{flex:1;min-width:0;display:flex;justify-content:space-between;gap:12px;text-align:left;padding:11px 0}
.gname{font-weight:500;overflow-wrap:anywhere}
.gval{flex:none;color:var(--muted);font-variant-numeric:tabular-nums}
.gdel{flex:none;min-width:36px;min-height:36px;padding:0 10px;border-radius:9px;color:var(--muted);font-weight:700}
.gdel.armed{background:var(--pend);color:#fff}
.exseg{margin-bottom:0}
.gtext{min-height:76px;resize:vertical;font:inherit;line-height:1.4}
.gdate{color:var(--muted);font-weight:500}
.elist{display:grid;gap:10px}
.emonth{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:6px 0 0}
.erow{display:flex;align-items:stretch;gap:10px;border-radius:14px;padding:10px;
  background:color-mix(in srgb,var(--c) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 34%,var(--surface))}
.edate{flex:none;width:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
  background:color-mix(in srgb,var(--c) 26%,var(--surface));color:color-mix(in srgb,var(--c) 52%,var(--on-mix))}
.edate b{font-size:22px;font-variant-numeric:tabular-nums}
.edate small{font-size:11px;font-weight:700;text-transform:uppercase}
.ebody{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px;padding:2px 0}
.ename{font-weight:700;overflow-wrap:anywhere}
.emeta{font-size:13px;color:var(--muted)}
.etopics{font-size:13px;overflow-wrap:anywhere;white-space:pre-line;margin-top:2px}
.eright{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:6px}
.ewhen{font-size:12px;font-weight:700;color:var(--muted)}
.ewhen.soon{color:var(--pend-ink)}
.ehint{color:var(--muted);font-size:13px;margin:12px 0 0}
.ghint{color:var(--muted);font-size:13px;margin:10px 0 0}
.bar.gbar{display:flex}
.bar.gbar i{flex:none;border-radius:0}
.bar.gbar i.wait,.sw-wait{background:repeating-linear-gradient(135deg,var(--wait) 0 6px,color-mix(in srgb,var(--wait) 50%,var(--surface)) 6px 12px)}
.glegend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);margin:8px 0 0}
.lk{display:inline-flex;align-items:center;gap:6px}
.lk i{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw-ok{background:var(--done)}
.gval.wait{color:var(--wait-ink);font-weight:600}
.gnote{color:var(--muted);font-size:13px;text-align:center;margin:0}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.empty{color:var(--muted);padding:6px 0}
.loading{color:var(--muted);padding:24px 4px}
.badge{display:inline-block;margin-left:10px;padding:2px 10px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:12px;font-weight:700;vertical-align:middle;letter-spacing:.02em}

/* Vista día */
.day{display:flex;flex-direction:column;gap:14px;max-width:760px}
.dayhead{padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.dh-wd{font-size:28px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.dh-date{color:var(--muted);font-weight:500;margin-top:2px}
.prog-wrap{min-width:200px;flex:1;max-width:280px}
.prog-txt{font-size:14px;font-weight:500;margin-bottom:7px}
.prog-txt.muted{color:var(--muted);margin:0}
.prog-txt .g{color:var(--done-ink)}
.prog-txt .r{color:var(--pend-ink)}
.bar{height:8px;border-radius:99px;background:var(--pend-bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);border-radius:99px}
.carry{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--pend-bg);color:var(--pend-ink);border-radius:12px;padding:10px 14px;font-weight:600}
.carry button{border:1px solid currentColor;border-radius:9px;padding:5px 12px;font-weight:700;color:inherit}
.sec{padding:16px 20px 18px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-head h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sec-head h2 span{font-weight:500;letter-spacing:.02em;text-transform:none;margin-left:6px}
.agenda{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:stretch}
.agenda2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.7fr);gap:6px 14px;align-items:start}
.acol{min-width:0}
.acol-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:0 0 8px}
.agenda2 .acol+.acol{border-left:1px solid var(--line);padding-left:14px}
.agenda2 .row{flex-direction:column;gap:3px}
.agenda2 .time{width:auto;text-align:left;padding-top:0;font-size:13px}
.agenda2 .time small{display:inline;font-size:13px}
.agenda2 .time small::before{content:" – "}
.time{width:52px;flex:none;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;padding-top:10px}
.time small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.ev{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:1px;border-radius:12px;padding:10px 14px;
  background:color-mix(in srgb,var(--c) 17%,var(--surface));
  border:1px solid color-mix(in srgb,var(--c) 38%,var(--surface));
  color:color-mix(in srgb,var(--c) 52%,var(--on-mix))}
.ev.exam{border-left:5px solid var(--c)}
.ev-t{font-weight:700;overflow-wrap:anywhere}
.ev-m{font-size:13px;opacity:.9}

.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task-t{flex:1;min-width:0;text-align:left;font-weight:500;overflow-wrap:anywhere}
.task.done .task-t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--done)}
.tag{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;
  background:color-mix(in srgb,var(--c) 17%,var(--surface));color:color-mix(in srgb,var(--c) 52%,var(--on-mix))}
.ck{position:relative;flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--pend);display:grid;place-items:center}
.ck::after{content:"";position:absolute;inset:-10px}
.ck:hover{background:var(--pend-bg)}
.ck svg{width:14px;height:14px;stroke:#fff;opacity:0}
.ck[aria-checked="true"]{background:var(--done);border-color:var(--done)}
.ck[aria-checked="true"] svg{opacity:1}
.ck.sm{width:18px;height:18px;border-width:2px}
.ck.sm svg{width:11px;height:11px}
.ck.sm::after{inset:-8px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.quick .in{flex:1 1 220px;width:auto}
.quick select{flex:0 1 190px;width:auto}
.quick input[type="date"]{flex:0 1 160px;width:auto}

.in{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.in::placeholder{color:var(--muted)}

/* Vista semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:280px;min-width:0}
.wday.is-today{border-color:var(--fg);border-width:2px;padding:9px}
.wd-head{display:flex;align-items:center;gap:8px;text-align:left;flex-wrap:wrap}
.wd-name{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.wd-num{font-size:20px;font-weight:700;line-height:1;min-width:30px;height:30px;display:grid;place-items:center;border-radius:99px;padding:0 4px}
.wd-num.is-today{background:var(--fg);color:var(--bg)}
.prog{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.prog.pend{background:var(--pend-bg);color:var(--pend-ink)}
.prog.ok{background:var(--done-bg);color:var(--done-ink)}
.mini-ev{display:block;width:100%;text-align:left;border-radius:9px;padding:6px 8px;font-size:13px;min-width:0;
  background:color-mix(in srgb,var(--c) 17%,var(--surface));
  border:1px solid color-mix(in srgb,var(--c) 38%,var(--surface));
  color:color-mix(in srgb,var(--c) 52%,var(--on-mix))}
.mini-ev b{display:block;font-variant-numeric:tabular-nums}
.mini-ev span{overflow-wrap:anywhere}
.mini-task{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.mini-task .ck{margin-top:1px}
.mini-task button.t{flex:1;min-width:0;text-align:left;overflow-wrap:anywhere}
.mini-task.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--done)}
.mini-task .dot{margin-top:6px}
.wd-add{margin-top:auto;border:1px dashed var(--line);border-radius:9px;padding:6px;color:var(--muted);font-size:13px;font-weight:600}
.wd-add:hover{color:var(--fg);border-color:var(--muted)}

/* Vista mes */
.mhead,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mhead{margin-bottom:6px}
.mhead span{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;text-align:center}
.mcell{min-height:112px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.mcell.out{background:var(--surface-2);opacity:.6}
.mcell:hover{border-color:var(--muted)}
.mc-num{font-weight:700;font-size:14px;min-width:26px;height:26px;display:grid;place-items:center;border-radius:99px;padding:0 3px}
.mc-num.is-today{background:var(--fg);color:var(--bg)}
.mc-pills{display:flex;flex-direction:column;gap:3px;width:100%;min-width:0}
.pill{display:block;font-size:12px;border-radius:6px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:color-mix(in srgb,var(--c) 17%,var(--surface));color:color-mix(in srgb,var(--c) 52%,var(--on-mix))}
.pill b{font-variant-numeric:tabular-nums}
.more{font-size:12px;color:var(--muted);font-weight:600}
.dots{display:none;flex-wrap:wrap;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}

/* Editor */
.overlay{position:fixed;inset:0;background:rgba(30,24,14,.5);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:18px;width:min(520px,100%);max-height:100%;overflow:auto;padding:20px;box-shadow:var(--shadow)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h2{font-size:20px;font-weight:700}
.hint{font-size:13px;color:var(--muted);margin:8px 0 16px}
.fld{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-bottom:14px;min-width:0}
.fld > label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
/* Safari de iPhone da a los campos de fecha y hora un ancho propio que desborda la columna: se anula */
input.in[type="date"],input.in[type="time"]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;min-height:44px;text-align:left;line-height:1.2}
input.in[type="date"]::-webkit-date-and-time-value,input.in[type="time"]::-webkit-date-and-time-value{text-align:left;min-width:0}
input.in[type="date"]::-webkit-datetime-edit,input.in[type="time"]::-webkit-datetime-edit{padding:0}
.fld>.in,.fld>select.in{box-sizing:border-box;max-width:100%}
.swatches{display:flex;flex-wrap:wrap;gap:8px;padding-top:2px}
.sw{position:relative;display:block}
.sw input{position:absolute;opacity:0;width:100%;height:100%;inset:0;margin:0;cursor:pointer}
.sw span{display:block;width:28px;height:28px;border-radius:50%;background:var(--c);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw input:checked + span{box-shadow:0 0 0 2px var(--fg)}
.sw input:focus-visible + span{outline:2px solid var(--fg);outline-offset:3px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--fg)}
.chk input{width:18px;height:18px;accent-color:var(--fg)}
.rep-n{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted)}
.rep-n .in{width:84px}
.err{color:var(--pend-ink);background:var(--pend-bg);border-radius:10px;padding:8px 12px;font-weight:600;margin-bottom:12px}
.sheet-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.sp{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;max-width:calc(100% - 32px);font-weight:600}

@media (prefers-reduced-motion: no-preference){
  .sheet{animation:pop .14s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
@media (max-width:900px){
  .week{grid-template-columns:1fr}
  .wday{min-height:0}
  .wd-head{flex-wrap:nowrap}
  .wd-name{min-width:34px}
}
@media (max-width:700px){
  .brand h1{font-size:24px}
  .mcell{min-height:68px;padding:5px;gap:4px}
  .mc-pills{display:none}
  .dots{display:flex}
  .mhead span{font-size:11px;letter-spacing:.02em}
  .mhead,.mgrid{gap:4px}
  .prog{padding:0 6px;font-size:11px}
  .sheet{padding:16px}
  .overlay{align-items:flex-end}
  .time{width:46px}
  .dh-wd{font-size:24px}
}
button{touch-action:manipulation}
input.in,select.in{font-size:16px}
.foot{margin-top:28px;display:flex;justify-content:center}
.linkbtn{color:var(--muted);font-size:13px;text-decoration:underline;padding:8px}
</style>
</head>
<body>

<div class="shell" id="shell">
  <header class="top">
    <div class="brand">
      <h1>Mi agenda</h1>
      <p class="period" id="period"></p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Sección">
        <button type="button" data-area="uni" aria-pressed="true">Universidad</button>
        <button type="button" data-area="personal" aria-pressed="false">Personal</button>
        <button type="button" data-area="examenes" aria-pressed="false">Exámenes</button>
      </div>
      <div class="seg" id="viewctl" role="group" aria-label="Vista">
        <button type="button" data-view="day" aria-pressed="true">Día</button>
        <button type="button" data-view="week" aria-pressed="false">Semana</button>
        <button type="button" data-view="month" aria-pressed="false">Mes</button>
      </div>
      <div class="nav" id="navctl">
        <button type="button" class="iconbtn" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button type="button" class="ghost" id="today">Hoy</button>
        <button type="button" class="iconbtn" id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <button type="button" class="primary" id="add">+ Añadir</button>
    </div>
  </header>
  <div class="legend" id="legend" role="group" aria-label="Filtrar por asignatura"></div>
  <p class="notice" id="notice" role="status" hidden></p>
  <main id="view"></main>
  <footer class="foot"><button type="button" class="linkbtn" id="logout">Cerrar sesión en este dispositivo</button></footer>
</div>

<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="form" role="dialog" aria-modal="true" aria-labelledby="dlg-title" novalidate>
    <div class="sheet-head">
      <h2 id="dlg-title">Nueva tarea</h2>
      <button type="button" class="iconbtn" id="dlg-x" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="seg wide" id="kindseg" role="group" aria-label="Tipo de tarea">
      <button type="button" data-kind="org" aria-pressed="true">Tarea organizada</button>
      <button type="button" data-kind="open" aria-pressed="false">Tarea abierta</button>
    </div>
    <p class="hint" id="kind-hint"></p>
    <div class="fld">
      <label for="f-title" id="f-title-l">Título</label>
      <input id="f-title" class="in" type="text" autocomplete="off" maxlength="300">
    </div>
    <div class="grid2">
      <div class="fld">
        <label for="f-date" id="f-date-l">Fecha</label>
        <input id="f-date" class="in" type="date">
      </div>
      <div class="fld" id="f-subject-w">
        <label for="f-subject">Asignatura</label>
        <select id="f-subject" class="in"></select>
      </div>
    </div>
    <div id="org-fields">
      <div class="fld">
        <label class="chk"><input type="checkbox" id="f-allday"> Todo el día (sin hora)</label>
      </div>
      <div class="grid2">
        <div class="fld">
          <label for="f-start">Hora de inicio</label>
          <input id="f-start" class="in" type="time">
        </div>
        <div class="fld">
          <label for="f-end">Hora de fin (opcional)</label>
          <input id="f-end" class="in" type="time">
        </div>
      </div>
      <div class="fld">
        <span class="lbl" id="color-l">Color</span>
        <div class="swatches" id="swatches" role="radiogroup" aria-labelledby="color-l"></div>
      </div>
      <div class="fld" id="rep-wrap">
        <label class="chk"><input type="checkbox" id="f-rep"> Repetir cada semana</label>
        <div class="rep-n" id="rep-n" hidden>
          <label for="f-weeks">Durante</label>
          <input id="f-weeks" class="in" type="number" min="2" max="40" value="15" inputmode="numeric">
          <span>semanas en total</span>
        </div>
      </div>
    </div>
    <p class="err" id="f-err" role="alert" hidden></p>
    <div class="sheet-actions">
      <button type="button" class="ghost danger" id="f-del" hidden>Eliminar</button>
      <span class="sp"></span>
      <button type="button" class="ghost" id="f-cancel">Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</div>
<div class="overlay" id="clave-overlay" hidden>
  <form class="sheet" id="clave-form" role="dialog" aria-modal="true" aria-labelledby="clave-title" novalidate>
    <div class="sheet-head"><h2 id="clave-title">Entrar en tu agenda</h2></div>
    <p class="hint">Escribe tu clave de acceso. Se guarda solo en este dispositivo.</p>
    <div class="fld">
      <label for="clave-in">Clave</label>
      <input id="clave-in" class="in" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <p class="err" id="clave-err" role="alert" hidden></p>
    <div class="sheet-actions"><span class="sp"></span><button type="submit" class="primary">Entrar</button></div>
  </form>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

/* ---------- Datos fijos ---------- */
var SUBJECTS=[
  {id:'micro',name:'Microbiología',color:'verde'},
  {id:'farma',name:'Farmacología',color:'azul'},
  {id:'fisio',name:'Fisiopatología',color:'lila'},
  {id:'epi',name:'Epidemiología',color:'amarillo'},
  {id:'ap',name:'Anatomía Patológica',color:'rosa'},
  {id:'holo',name:'Holocausto',color:'naranja'},
  {id:'inv',name:'Investigación',color:'turquesa'}
];
var COLORS=[['verde','Verde'],['azul','Azul'],['lila','Lila'],['amarillo','Amarillo'],['rosa','Rosa'],['naranja','Naranja'],['turquesa','Turquesa'],['gris','Gris']];
var COLOR_IDS=new Set(COLORS.map(function(c){return c[0]}));
var WD_SHORT=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
var WD_LONG=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
var MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MON3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function subjectById(id){return SUBJECTS.find(function(s){return s.id===id})}
function subjectColor(id){var s=subjectById(id);return s?s.color:'gris'}

/* ---------- Utilidades ---------- */
var $=function(s){return document.querySelector(s)};
var PK='agenda-medicina.';
function pref(k,v){
  try{
    if(v===undefined) return localStorage.getItem(PK+k);
    localStorage.setItem(PK+k,v);
  }catch(e){return null}
}
function pad(n){return String(n).padStart(2,'0')}
function fmtKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseKey(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function wdi(d){return (d.getDay()+6)%7}
function startOfWeek(d){return addDays(d,-wdi(d))}
function addMonths(d,n){
  var t=new Date(d.getFullYear(),d.getMonth()+n,1);
  var last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  return new Date(t.getFullYear(),t.getMonth(),Math.min(d.getDate(),last));
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function rangeText(a,b){
  if(a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth())
    return a.getDate()+' – '+b.getDate()+' '+MON3[b.getMonth()]+' '+b.getFullYear();
  if(a.getFullYear()===b.getFullYear())
    return a.getDate()+' '+MON3[a.getMonth()]+' – '+b.getDate()+' '+MON3[b.getMonth()]+' '+b.getFullYear();
  return a.getDate()+' '+MON3[a.getMonth()]+' '+a.getFullYear()+' – '+b.getDate()+' '+MON3[b.getMonth()]+' '+b.getFullYear();
}
function newId(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function cs(c){return '--c:var(--k-'+(COLOR_IDS.has(c)?c:'gris')+')'}

function h(tag,props){
  var el=document.createElement(tag);
  if(props){
    Object.keys(props).forEach(function(k){
      var v=props[k];
      if(v==null||v===false) return;
      if(k==='class') el.className=v;
      else if(k.indexOf('on')===0) el.addEventListener(k.slice(2),v);
      else if(v===true) el.setAttribute(k,'');
      else el.setAttribute(k,v);
    });
  }
  for(var i=2;i<arguments.length;i++) append(el,arguments[i]);
  return el;
}
function append(el,kid){
  if(kid==null||kid===false) return;
  if(Array.isArray(kid)){kid.forEach(function(k){append(el,k)});return}
  el.append(kid.nodeType?kid:document.createTextNode(String(kid)));
}
function checkSvg(){
  var t=document.createElement('template');
  t.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  return t.content.firstChild;
}
var tt;
function toast(m){
  var el=$('#toast');el.textContent=m;el.hidden=false;
  clearTimeout(tt);tt=setTimeout(function(){el.hidden=true},4500);
}

/* ---------- Estado y almacenamiento ---------- */
/* Las tareas viven en Supabase y se acceden con una función protegida por clave.
   En el dispositivo se guardan una copia (para abrir sin conexión) y una cola de
   cambios pendientes de enviar. */
var API='https://oigcuosxnugyhexvukua.supabase.co/functions/v1/tareas';
var tasks=new Map();
var ready=false;
var net={status:'loading',msg:''}; /* loading | ok | offline | error | clave */
var outbox=new Map(); /* id -> {type:'upsert',tarea} | {type:'delete'} */
var viewPref=pref('view');
var state={
  view:(viewPref==='day'||viewPref==='week'||viewPref==='month')?viewPref:'day',
  cursor:startOfDay(new Date()),
  filter:null,
  quickDraft:'',
  quickSubject:'',
  area:pref('area')==='personal'?'personal':(pref('area')==='examenes'||pref('area')==='notas')?'examenes':'uni',
  pDraft:'',
  pDate:'',
  lastKind:pref('kind')==='open'?'open':'org'
};

function clean(id,raw){
  if(!raw||(raw.kind!=='org'&&raw.kind!=='open'&&raw.kind!=='personal')||typeof raw.title!=='string') return null;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(raw.date||'')&&!(raw.kind==='personal'&&!raw.date)) return null;
  return {
    id:id,kind:raw.kind,title:raw.title,date:raw.date||'',
    subject:subjectById(raw.subject)?raw.subject:'',
    color:COLOR_IDS.has(raw.color)?raw.color:'',
    type:typeof raw.type==='string'?raw.type:'',
    start:/^\d{2}:\d{2}$/.test(raw.start||'')?raw.start:'',
    end:/^\d{2}:\d{2}$/.test(raw.end||'')?raw.end:'',
    done:!!raw.done,created:+raw.created||0
  };
}
function body(t){
  return {kind:t.kind,title:t.title,date:t.date||'',subject:t.subject||'',color:t.color||'',type:'',start:t.start||'',end:t.end||'',done:!!t.done,created:t.created||Date.now()};
}

function loadJson(key,fallback){
  try{var v=JSON.parse(pref(key));return v==null?fallback:v}catch(e){return fallback}
}
function saveCache(){pref('tasks',JSON.stringify(Array.from(tasks.values())))}
function saveOutbox(){pref('outbox',JSON.stringify(Array.from(outbox.entries())))}
function getClave(){return pref('clave')||''}
function applyOutbox(){
  outbox.forEach(function(o,id){
    if(o.type==='delete') tasks.delete(id);
    else tasks.set(id,o.tarea);
  });
}

async function api(op,extra){
  var res;
  try{
    res=await fetch(API,{
      method:'POST',
      headers:{'Content-Type':'application/json','x-clave':getClave()},
      body:JSON.stringify(Object.assign({op:op},extra||{}))
    });
  }catch(e){
    var off=new Error('Sin conexión');off.code='offline';throw off;
  }
  var data={};
  try{data=await res.json()}catch(e){}
  if(res.status===401){var bad=new Error('Clave incorrecta');bad.code='clave';throw bad}
  if(!res.ok){
    var err=new Error(data.error||('Error '+res.status));
    err.code=res.status>=500?'server':'client';
    throw err;
  }
  return data;
}

/* Cambios locales: se aplican al momento y se envían en cuanto hay conexión */
function afterLocalChange(){saveCache();saveOutbox();render();sync()}
function addTask(data){
  var id=newId();
  var t=Object.assign({id:id},body(data));
  tasks.set(id,t);
  outbox.set(id,{type:'upsert',tarea:t});
  afterLocalChange();
  return Promise.resolve();
}
function patch(id,p){
  var t=tasks.get(id);
  if(!t) return Promise.resolve();
  var nt=Object.assign({},t,p);
  tasks.set(id,nt);
  outbox.set(id,{type:'upsert',tarea:nt});
  afterLocalChange();
  return Promise.resolve();
}
function removeTask(id){
  tasks.delete(id);
  outbox.set(id,{type:'delete'});
  afterLocalChange();
  return Promise.resolve();
}

/* Notas: misma idea que las tareas (copia local y cola de cambios pendientes) */
var gOutbox=new Map(); /* id -> {type:'upsert',nota} | {type:'delete'} */
function saveGOutbox(){pref('goutbox',JSON.stringify(Array.from(gOutbox.entries())))}
function gChanged(){saveGrades();saveGOutbox();render();sync()}
function gBody(g){return {id:g.id,subject:g.subject,name:g.name,score:g.score,weight:g.weight,date:g.date||'',time:g.time||'',topics:g.topics||'',created:g.created||0}}
async function syncNotas(){
  var snap=Array.from(gOutbox.entries());
  var ups=snap.filter(function(e){return e[1].type==='upsert'});
  var dels=snap.filter(function(e){return e[1].type==='delete'});
  function quitar(e){if(gOutbox.get(e[0])===e[1]) gOutbox.delete(e[0])}
  for(var i=0;i<ups.length;i+=50){
    var chunk=ups.slice(i,i+50);
    try{
      await api('notas_upsert',{notas:chunk.map(function(e){return gBody(e[1].nota)})});
      chunk.forEach(quitar);
    }catch(err){
      if(err.code!=='client') throw err;
      for(var k=0;k<chunk.length;k++){
        try{await api('notas_upsert',{notas:[gBody(chunk[k][1].nota)]})}
        catch(e2){
          if(e2.code!=='client') throw e2;
          toast('No se pudo guardar la nota «'+chunk[k][1].nota.name+'»: '+e2.message);
        }
        quitar(chunk[k]);
      }
    }
  }
  for(var j=0;j<dels.length;j++){
    try{await api('notas_delete',{id:dels[j][0]})}
    catch(err){if(err.code!=='client') throw err}
    quitar(dels[j]);
  }
  saveGOutbox();
  var r=await api('notas_list');
  var lista=[];
  (r.notas||[]).forEach(function(raw){var g=cleanGrade(raw);if(g) lista.push(g)});
  gOutbox.forEach(function(o,id){
    lista=lista.filter(function(x){return x.id!==id});
    if(o.type==='upsert') lista.push(o.nota);
  });
  grades=lista;
  saveGrades();
  pref('gsync','1');
}

/* Sincronización: primero se envía lo pendiente y después se descarga la lista completa */
var syncing=false,again=false;
function sigOf(){
  var list=Array.from(tasks.values()).sort(function(a,b){return a.id<b.id?-1:1});
  return JSON.stringify(list)+'|'+JSON.stringify(grades)+'|'+grades.filter(isUpcoming).length+'|'+outbox.size+'|'+gOutbox.size+'|'+net.status+'|'+ready;
}
async function enviar(){
  var snap=Array.from(outbox.entries());
  var ups=snap.filter(function(e){return e[1].type==='upsert'});
  var dels=snap.filter(function(e){return e[1].type==='delete'});
  function quitar(e){if(outbox.get(e[0])===e[1]) outbox.delete(e[0])}
  for(var i=0;i<ups.length;i+=50){
    var chunk=ups.slice(i,i+50);
    var filas=chunk.map(function(e){return Object.assign({id:e[0]},body(e[1].tarea))});
    try{
      await api('upsert',{tareas:filas});
      chunk.forEach(quitar);
    }catch(err){
      if(err.code!=='client') throw err;
      /* el servidor rechazó el lote: se aísla la tarea inválida para que no bloquee a las demás */
      for(var k=0;k<chunk.length;k++){
        try{await api('upsert',{tareas:[filas[k]]})}
        catch(e2){
          if(e2.code!=='client') throw e2;
          toast('No se pudo guardar «'+filas[k].title+'»: '+e2.message);
        }
        quitar(chunk[k]);
      }
    }
  }
  for(var j=0;j<dels.length;j++){
    try{await api('delete',{id:dels[j][0]})}
    catch(err){if(err.code!=='client') throw err}
    quitar(dels[j]);
  }
  saveOutbox();
}
async function sync(){
  if(syncing){again=true;return}
  if(!getClave()){net.status='clave';openClave();render();return}
  syncing=true;
  var before=sigOf();
  try{
    if(outbox.size) await enviar();
    var r=await api('list');
    tasks.clear();
    (r.tareas||[]).forEach(function(raw){var t=clean(raw&&raw.id,raw);if(t) tasks.set(t.id,t)});
    applyOutbox();
    saveCache();
    try{await syncNotas()}catch(e){if(e.code==='clave') throw e}
    net.status='ok';net.msg='';
    closeClave();
  }catch(e){
    if(e.code==='clave'){
      pref('clave','');net.status='clave';
      openClave('Clave incorrecta. Revisa que esté bien escrita.');
    }else if(e.code==='offline'||e.code==='server'){
      net.status='offline';
    }else{
      net.status='error';net.msg=e.message;
    }
  }finally{
    syncing=false;ready=true;
    if(sigOf()!==before) render();
    if(again){again=false;sync()}
  }
}

/* Pantalla de clave */
function openClave(msg){
  var o=$('#clave-overlay');

function closeClave(){
  var o=$('#clave-overlay');
  if(o.hidden) return;
  o.hidden=true;
  if(overlay.hidden){shell.inert=false;document.body.style.overflow=''}
}
function updateNotice(){
  var n=$('#notice'),p=outbox.size+gOutbox.size,txt='';
  if(net.status==='offline'){
    txt='Sin conexión. '+(p?p+(p===1?' cambio pendiente de enviar.':' cambios pendientes de enviar.'):'Se muestran las últimas tareas guardadas.');

    txt='No se pudo sincronizar: '+net.msg;

function startApp(){
  loadJson('tasks',[]).forEach(function(r){var t=clean(r&&r.id,r);if(t) tasks.set(t.id,t)});
  loadJson('outbox',[]).forEach(function(e){
    if(Array.isArray(e)&&e[1]&&(e[1].type==='delete'||(e[1].type==='upsert'&&e[1].tarea))) outbox.set(e[0],e[1]);
  });
  applyOutbox();
  loadJson('goutbox',[]).forEach(function(e){
    if(Array.isArray(e)&&e[1]&&(e[1].type==='delete'||(e[1].type==='upsert'&&cleanGrade(e[1].nota)))) gOutbox.set(e[0],e[1]);
  });
  /* Primera vez con sincronización de notas: las que ya había en este dispositivo se envían */
  if(pref('gsync')!=='1') grades.forEach(function(g){if(!gOutbox.has(g.id)) gOutbox.set(g.id,{type:'upsert',nota:Object.assign({},g)})});
  ready=tasks.size>0||!getClave();
  render();
  sync();
  document.addEventListener('visibilitychange',function(){if(!document.hidden){tickExams();sync()}});
  window.addEventListener('online',function(){sync()});
  setInterval(function(){if(document.hidden) return;tickExams();if(getClave()) sync()},30000);
}

/* ---------- Consultas ---------- */
function buildIndex(){
  var m=new Map();
  tasks.forEach(function(t){
    if(t.kind==='personal') return;
    if(state.filter&&t.subject!==state.filter) return;
    var e=m.get(t.date);
    if(!e){e={org:[],open:[]};m.set(t.date,e)}
    (t.kind==='org'?e.org:e.open).push(t);
  });
  /* Los exámenes con fecha (Exámenes > Calendario) aparecen también en la agenda, en su día y a su hora */
  grades.forEach(function(g){
    if(!g.date) return;
    if(state.filter&&g.subject!==state.filter) return;
    var sub=subjectById(g.subject);
    var e=m.get(g.date);
    if(!e){e={org:[],open:[]};m.set(g.date,e)}
    e.org.push({id:'ex:'+g.id,gradeId:g.id,exam:true,kind:'org',
      title:/^examen/i.test(g.name)?g.name:'Examen: '+g.name,
      date:g.date,subject:g.subject,color:sub?sub.color:'gris',start:g.time||'',end:'',
      weight:g.weight,score:g.score,created:g.created||0});
  });
  m.forEach(function(e){
    e.org.sort(function(a,b){return (a.start||'').localeCompare(b.start||'')||a.created-b.created});
    e.open.sort(function(a,b){return (a.done-b.done)||a.created-b.created});
  });
  return m;
}
function goExam(id){
  var g=grades.find(function(x){return x.id===id});
  if(!g) return;
  state.area='examenes';pref('area','examenes');
  if(isUpcoming(g)){
    exSub='cal';
    eDraft={id:g.id,subject:g.subject,name:g.name,date:g.date,time:g.time||'',weight:String(g.weight).replace('.',','),topics:g.topics||''};
    eErr='';eArm=null;
  }else{
    exSub='notas';
    gDraft={id:g.id,subject:g.subject,name:g.name,score:g.score===null?'':String(g.score).replace('.',','),weight:String(g.weight).replace('.',',')};
    gErr='';gArm=null;
  }
  pref('exsub',exSub);
  render();window.scrollTo(0,0);
}
function openOrg(t){if(t.exam) goExam(t.gradeId); else openEditor({id:t.id})}

function colorOf(t){
  if(t.kind==='org'&&t.color) return t.color;
  return subjectColor(t.subject);
}

/* ---------- Exámenes: calendario y notas ---------- */
/* Un examen es una nota con fecha. Mientras no ha llegado su fecha (y no tiene nota) está en el
   Calendario; al pasar la fecha, pasa solo a Notas como pendiente de calificación. */
var exSub=pref('exsub')==='cal'?'cal':'notas';
var eDraft={id:null,subject:'',name:'',date:'',time:'',weight:'',topics:''};
var eErr='',eArm=null;
function emptyDraft(sub){return {id:null,subject:sub||'',name:'',date:'',time:'',weight:'',topics:''}}
function examTime(g){
  var d=parseKey(g.date);
  if(g.time){var p=g.time.split(':');d.setHours(+p[0],+p[1],0,0)}
  else d.setHours(23,59,59,999);
  return d;
}
function isUpcoming(g){return g.score===null&&!!g.date&&examTime(g).getTime()>Date.now()}
function daysUntil(g){return Math.round((parseKey(g.date).getTime()-startOfDay(new Date()).getTime())/86400000)}
function shortDate(k){var d=parseKey(k);return d.getDate()+' '+MON3[d.getMonth()]}

function renderExamenes(){
  var wrap=h('div',{class:'notas'});
  function tab(id,label){
    return h('button',{type:'button','data-sub':id,'aria-pressed':String(exSub===id),onclick:function(){
      exSub=id;pref('exsub',id);render();window.scrollTo(0,0);
    }},label);
  }
  wrap.append(h('div',{class:'seg wide exseg',role:'group','aria-label':'Sección de exámenes'},tab('notas','Notas'),tab('cal','Calendario')));
  if(exSub==='cal') calendarioInto(wrap); else notasInto(wrap);
  return wrap;
}

function calendarioInto(wrap){
  var editing=!!eDraft.id;
  var sel=subjectSelect('e-subject',eDraft.subject,'Asignatura…');
  sel.setAttribute('data-fk','e-subject');
  sel.addEventListener('change',function(){eDraft.subject=sel.value});
  function inp(key,label,ph,type,fk,cls,mode){
    var upd=function(e){eDraft[key]=e.target.value};
    return h('label',{class:'gf'+(cls?' '+cls:'')},h('span',null,label),
      h('input',{class:'in',type:type,autocomplete:'off',placeholder:ph,inputmode:mode,maxlength:key==='name'?60:key==='weight'?6:null,
        'data-fk':fk,value:eDraft[key],oninput:upd,onchange:upd}));
  }
  var topics=h('textarea',{class:'in gtext',rows:3,maxlength:500,placeholder:'Temas 1 a 5, seminarios 3 y 4…','data-fk':'e-topics',
    oninput:function(e){eDraft.topics=e.target.value}},eDraft.topics);

  var form2=h('form',{class:'card sec gform',novalidate:true,onsubmit:function(e){
    e.preventDefault();
    var w=parseNum(eDraft.weight);
    if(!eDraft.subject) eErr='Elige la asignatura.';
    else if(!/^\d{4}-\d{2}-\d{2}$/.test(eDraft.date)) eErr='Elige la fecha del examen.';

    if(eErr){render();return}
    var name=eDraft.name.trim()||'Examen',tps=eDraft.topics.trim().slice(0,500),saved;
    if(eDraft.id){

      if(saved) Object.assign(saved,{subject:eDraft.subject,name:name,weight:w,date:eDraft.date,time:eDraft.time||'',topics:tps});
    }else{
      saved={id:'g'+newId(),subject:eDraft.subject,name:name,score:null,weight:w,date:eDraft.date,time:eDraft.time||'',topics:tps,created:Date.now()};
      grades.push(saved);
    }
    if(saved) gOutbox.set(saved.id,{type:'upsert',nota:Object.assign({},saved)});
    eDraft=emptyDraft(eDraft.subject);
    gChanged();
  }},
    h('div',{class:'sec-head'},h('h2',null,editing?'Editar examen':'Añadir examen')),
    h('div',{class:'gfields'},
      h('label',{class:'gf gf-wide'},h('span',null,'Asignatura'),sel),
      inp('name','Nombre','Parcial 3','text','e-name','gf-wide'),
      inp('date','Fecha','','date','e-date'),
      inp('time','Hora (opcional)','','time','e-time'),
      inp('weight','% de la nota final','30','text','e-weight','','decimal'),
      h('label',{class:'gf gf-wide'},h('span',null,'Temas (opcional)'),topics)),
    eErr?h('p',{class:'gerr',role:'alert'},eErr):null,
    h('div',{class:'gbtns'},
      h('button',{type:'submit',class:'primary'},editing?'Guardar cambios':'Añadir examen'),
      editing?h('button',{type:'button',class:'ghost',onclick:function(){eDraft=emptyDraft(eDraft.subject);eErr='';render()}},'Cancelar'):null));
  wrap.append(form2);

  var up=grades.filter(isUpcoming).sort(function(a,b){return (examTime(a)-examTime(b))||(a.created-b.created)});
  var card=h('section',{class:'card sec'},

      }

  }
  card.append(h('p',{class:'ehint'},'Cuando pasa la fecha de un examen, pasa solo a Notas como pendiente de calificación.'));
  wrap.append(card);
}

function examRow(g){

  var when=n<=0?'Hoy':n===1?'Mañana':'En '+n+' días';

/* ---------- Notas y nota final ---------- */
/* Se guardan en Supabase igual que las tareas (copia local + cambios pendientes de enviar). Cada nota: asignatura, nombre,
   calificación sobre 10 y porcentaje que pesa en la nota final de la asignatura. */
var grades=[];
function cleanGrade(g){
  if(!g||typeof g.id!=='string'||typeof g.name!=='string'||!subjectById(g.subject)) return null;
  var sc=(g.score===null||g.score===undefined||g.score==='')?null:+g.score,w=+g.weight;
  if(sc!==null&&(!isFinite(sc)||sc<0||sc>10)) return null;
  if(!isFinite(w)||w<=0||w>100) return null;
  return {id:g.id,subject:g.subject,name:g.name.slice(0,60),score:sc,weight:w,created:+g.created||0,
    date:/^\d{4}-\d{2}-\d{2}$/.test(g.date||'')?g.date:'',

function parseNum(v){
  var t=String(v).trim().replace(',','.');
  return /^\d+(\.\d+)?$/.test(t)?parseFloat(t):NaN;
}
function r2(n){return Math.round(n*100)/100}
function fmtN(n){return r2(n).toLocaleString('es-ES',{maximumFractionDigits:2})}
function gradeSummary(subjectId){
  var list=grades.filter(function(g){return g.subject===subjectId&&!isUpcoming(g)});
  var w=0,wp=0,pts=0;
  list.forEach(function(g){
    if(g.score===null) wp+=g.weight;
    else{w+=g.weight;pts+=g.score*g.weight/100}
  });
  /* w: porcentaje con nota; wp: porcentaje pendiente de nota (examen hecho, sin calificación) */
  return {list:list,w:r2(w),wp:r2(wp),tot:r2(w+wp),pts:pts};
}

function subjectGradeCard(sub){
  var sm=gradeSummary(sub.id);
  var complete=sm.tot===100&&sm.wp===0,over=sm.tot>100,some=sm.list.length>0;
  var card=h('section',{class:'card sec gcard',style:cs(sub.color)});

  var head=h('div',{class:'ghead'},
    h('h3',{class:'gtitle'},h('i',{class:'dot'}),sub.name));
  if(some){
    head.append(sm.w>0
      ?h('div',{class:'gbig'+(complete?' ok':'')},
        h('b',null,fmtN(sm.pts)),
        h('small',null,complete?'Nota final':'puntos de 10 hasta ahora'))
      :h('div',{class:'gbig'},h('b',null,'–'),h('small',null,'sin ninguna nota todavía')));
  }
  card.append(head);

  if(!some){
    card.append(h('p',{class:'empty'},'Sin notas todavía.'));
    return card;
  }

  var chip;
  if(complete) chip=h('p',{class:'gchip ok'},'Nota final calculada: los porcentajes suman el 100 %.');
  else if(over) chip=h('p',{class:'gchip bad'},'Los porcentajes suman '+fmtN(sm.tot)+' %, más del 100 %. Revisa los pesos.');
  else if(sm.wp===0) chip=h('p',{class:'gchip bad'},'Nota no calculada del todo: llevas evaluado el '+fmtN(sm.w)+' % y falta el '+fmtN(100-sm.tot)+' %.');
  else{
    var bits=[];
    if(sm.w>0) bits.push('con nota el '+fmtN(sm.w)+' %');
    bits.push('pendiente de nota el '+fmtN(sm.wp)+' %');
    if(sm.tot<100) bits.push('sin examinar el '+fmtN(100-sm.tot)+' %');
    chip=h('p',{class:'gchip bad'},'Nota no calculada del todo: '+bits.join(', ')+'.');
  }
  card.append(chip);
  var gw=Math.min(100,sm.w),pw=Math.min(100-gw,sm.wp);
  card.append(h('div',{class:'bar gbar','aria-hidden':'true'},
    h('i',{style:'width:'+gw+'%'}),
    pw>0?h('i',{class:'wait',style:'width:'+pw+'%'}):null));
  if(sm.wp>0){
    card.append(h('p',{class:'glegend'},
      h('span',{class:'lk'},h('i',{class:'sw-ok'}),'Con nota'),
      h('span',{class:'lk'},h('i',{class:'sw-wait'}),'Pendiente de nota')));
  }

  if(!complete&&!over&&sm.w>0){
    var media=sm.pts/(sm.w/100);
    var extra='Media de lo evaluado: '+fmtN(media)+'. ';
    var resto=100-sm.w;
    var restoTxt=sm.wp>0?'restante':'que falta';
    if(sm.pts>=5) extra+='Ya tienes el 5 asegurado.';
    else{
      var need=(5-sm.pts)/(resto/100);
      extra+=need>10?'Con lo que falta ya no se llega al 5.'
        :'Para llegar al 5 necesitas una media de '+fmtN(Math.ceil(need*100)/100)+' en el '+fmtN(resto)+' % '+restoTxt+'.';
    }
    card.append(h('p',{class:'gextra'},extra));
  }

  var list=h('div',{class:'glist'});
  sm.list.forEach(function(g){
    var armed=gArm===g.id,pend=g.score===null;
    list.append(h('div',{class:'grow'},
      h('button',{type:'button',class:'gedit','data-fk':'ge'+g.id,'aria-label':'Editar '+g.name,onclick:function(){
        gDraft={id:g.id,subject:g.subject,name:g.name,score:pend?'':String(g.score).replace('.',','),weight:String(g.weight).replace('.',',')};
        gErr='';gArm=null;render();window.scrollTo({top:0,behavior:'smooth'});
      }},h('span',{class:'gname'},g.name,g.date?h('small',{class:'gdate'},' · '+shortDate(g.date)):null),
        h('span',{class:'gval'+(pend?' wait':'')},(pend?'Pendiente':fmtN(g.score))+' · '+fmtN(g.weight)+' %')),
      h('button',{type:'button',class:'gdel'+(armed?' armed':''),'aria-label':(armed?'Confirmar: eliminar ':'Eliminar ')+g.name,onclick:function(){
        if(armed){
          grades=grades.filter(function(x){return x.id!==g.id});
          if(gDraft.id===g.id) gDraft={id:null,subject:gDraft.subject,name:'',score:'',weight:''};
          gArm=null;gOutbox.set(g.id,{type:'delete'});
          gChanged();
        }else{gArm=g.id;render()}
      }},armed?'¿Seguro?':'✕')));
  });
  card.append(list);
  return card;
}

var lastUp=-1;

function render(){
  lastUp=grades.filter(isUpcoming).length;
  var ae=document.activeElement;
  var fk=ae&&ae.dataset?ae.dataset.fk:null;
  var ss=null,se=null;
  if(fk&&typeof ae.selectionStart==='number'){ss=ae.selectionStart;se=ae.selectionEnd}

  var todayKey=fmtKey(new Date());
  var c=state.cursor;
  var personal=state.area==='personal';
  var examenes=state.area==='examenes';
  var period='';
  if(personal) period='Fuera de la universidad';
  else if(examenes) period='Exámenes y notas';
  else if(state.view==='day'){var ws=startOfWeek(c);period='Semana · '+rangeText(ws,addDays(ws,6))}
  else if(state.view==='week'){var s=startOfWeek(c);period=rangeText(s,addDays(s,6))}
  else period=cap(MONTHS[c.getMonth()])+' '+c.getFullYear();
  $('#period').textContent=period;

  document.querySelectorAll('[data-view]').forEach(function(b){
    b.setAttribute('aria-pressed',String(b.dataset.view===state.view));
  });
  document.querySelectorAll('.lg').forEach(function(b){
    b.setAttribute('aria-pressed',String(b.dataset.subject===state.filter));
  });
  updateNotice();
  document.querySelectorAll('[data-area]').forEach(function(b){
    b.setAttribute('aria-pressed',String(b.dataset.area===state.area));
  });
  $('#viewctl').hidden=personal||examenes;$('#navctl').hidden=personal||examenes;$('#legend').hidden=personal||examenes;$('#add').hidden=examenes;

  var view=$('#view');
  if(!ready){
    view.replaceChildren(h('p',{class:'loading'},'Cargando tus tareas…'));
    return;
  }
  var idx=buildIndex();
  var node=examenes?renderExamenes():personal?renderPersonal():state.view==='day'?renderDay(idx,todayKey):state.view==='week'?renderWeek(idx,todayKey):renderMonth(idx,todayKey);
  view.replaceChildren(node);

  if(fk){
    var n=view.querySelector('[data-fk="'+fk+'"]');
    if(n){
      n.focus({preventScroll:true});
      if(ss!=null&&n.setSelectionRange){try{n.setSelectionRange(ss,se)}catch(e){}}
    }
  }
}

    addTask({kind:'personal',title:title,date:when,subject:'',done:false,created:Date.now()});
  }},input,date,h('button',{type:'submit',class:'primary'},'Añadir'));

  wrap.append(h('section',{class:'card sec'},
    h('div',{class:'sec-head'},h('h2',null,'Por hacer',total?h('span',null,done+' de '+total):null)),
    total?h('div',{class:'tasks'},list.map(personalRow)):h('p',{class:'empty'},'Nada pendiente. Añade llamadas, recados o lo que quieras.'),
    form));
  return wrap;
}

function goDay(d){
  state.view='day';state.cursor=startOfDay(d);pref('view','day');
  render();window.scrollTo(0,0);
}

/* ---------- Navegación ---------- */
function shift(dir){
  var c=state.cursor;
  state.cursor=state.view==='day'?addDays(c,dir):state.view==='week'?addDays(c,7*dir):addMonths(c,dir);
  render();
}
$('#prev').addEventListener('click',function(){shift(-1)});
$('#next').addEventListener('click',function(){shift(1)});
$('#today').addEventListener('click',function(){state.cursor=startOfDay(new Date());render()});
document.querySelectorAll('[data-view]').forEach(function(b){
  b.addEventListener('click',function(){state.view=b.dataset.view;pref('view',state.view);render()});
});
$('#add').addEventListener('click',function(){
  if(state.area==='personal') openEditor({kind:'personal'});
  else openEditor({date:fmtKey(state.cursor)});
});
document.querySelectorAll('[data-area]').forEach(function(b){
  b.addEventListener('click',function(){state.area=b.dataset.area;pref('area',state.area);render()});
});

var legend=$('#legend');
SUBJECTS.forEach(function(s){
  legend.append(h('button',{type:'button',class:'lg',style:cs(s.color),'data-subject':s.id,'aria-pressed':'false',onclick:function(){
    state.filter=state.filter===s.id?null:s.id;render();
  }},h('i',{class:'dot'}),s.name));
});

/* ---------- Editor ---------- */
var overlay=$('#overlay'),form=$('#form'),shell=$('#shell');
var f={
  title:$('#f-title'),date:$('#f-date'),subject:$('#f-subject'),
  start:$('#f-start'),end:$('#f-end'),allday:$('#f-allday'),rep:$('#f-rep'),weeks:$('#f-weeks'),err:$('#f-err'),del:$('#f-del')
};
var ed=null,lastFocus=null;

f.subject.append(h('option',{value:''},'Sin asignatura'));
SUBJECTS.forEach(function(s){f.subject.append(h('option',{value:s.id},s.name))});
COLORS.forEach(function(c){
  $('#swatches').append(h('label',{class:'sw',style:cs(c[0]),title:c[1]},
    h('input',{type:'radio',name:'color',value:c[0],'aria-label':c[1],onchange:function(){ed.touched=true}}),
    h('span')));
});
function setColor(c){
  var r=form.querySelector('input[name="color"][value="'+c+'"]');
  if(r) r.checked=true;
}
function getColor(){
  var r=form.querySelector('input[name="color"]:checked');
  return r?r.value:'gris';
}
function setKind(k){
  ed.kind=k;
  form.querySelectorAll('[data-kind]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.kind===k))});
  $('#org-fields').hidden=k!=='org';
  $('#f-subject-w').hidden=k==='personal';
  $('#f-date-l').textContent=k==='personal'?'Fecha (opcional)':'Fecha';
  $('#kind-hint').textContent=k==='org'
    ?'Clases, seminarios y prácticas obligatorias, con hora fija.'
    :k==='open'
    ?'Algo que hacer ese día, sin hora: estudiar un tema, hacer un trabajo…'
    :'Algo que no tiene que ver con la universidad: llamadas, recados, viajes…';
  f.title.placeholder=k==='org'?'Opcional. Si lo dejas vacío se usa el nombre de la asignatura':k==='open'?'Por ejemplo: estudiar tema 4 de Farmacología':'Por ejemplo: llamar al dentista';
  $('#f-title-l').textContent=k==='org'?'Título (opcional)':'Título';
}
form.querySelectorAll('[data-kind]').forEach(function(b){
  b.addEventListener('click',function(){if(ed&&!ed.id) setKind(b.dataset.kind)});
});
f.subject.addEventListener('change',function(){
  if(ed&&!ed.touched) setColor(subjectColor(f.subject.value));
});
f.rep.addEventListener('change',function(){$('#rep-n').hidden=!f.rep.checked});

function syncAllday(){
  var on=f.allday.checked;
  f.start.closest('.fld').hidden=on;f.end.closest('.fld').hidden=on;
}
f.allday.addEventListener('change',syncAllday);

function showErr(m){f.err.textContent=m;f.err.hidden=!m}
function resetDel(){f.del.textContent='Eliminar';f.del.classList.remove('armed');if(ed) ed.armed=false}

function openEditor(opts){
  opts=opts||{};
  var t=opts.id?tasks.get(opts.id):null;
  ed={id:t?t.id:null,kind:t?t.kind:(opts.kind||state.lastKind),touched:false,armed:false};
  lastFocus=document.activeElement;
  $('#dlg-title').textContent=t?'Editar tarea':'Nueva tarea';
  setKind(ed.kind);
  $('#kindseg').hidden=!!t||ed.kind==='personal';
  f.title.value=t?t.title:'';
  f.date.value=t?t.date:(ed.kind==='personal'?'':(opts.date||fmtKey(state.cursor)));
  f.subject.value=t?t.subject:'';
  f.start.value=t&&t.start?t.start:'09:00';
  f.end.value=t?t.end:'';
  f.allday.checked=!!(t&&t.kind==='org'&&!t.start);syncAllday();
  var sc=subjectColor(f.subject.value);
  setColor(t&&t.kind==='org'&&t.color?t.color:sc);
  ed.touched=!!(t&&t.kind==='org'&&t.color&&t.color!==sc);
  f.rep.checked=false;$('#rep-n').hidden=true;f.weeks.value=15;
  $('#rep-wrap').hidden=!!t;
  f.del.hidden=!t;resetDel();
  showErr('');
  overlay.hidden=false;
  shell.inert=true;
  document.body.style.overflow='hidden';
  setTimeout(function(){f.title.focus()},0);
}
function closeEditor(){
  overlay.hidden=true;
  shell.inert=false;
  document.body.style.overflow='';
  ed=null;
  if(lastFocus&&document.body.contains(lastFocus)){try{lastFocus.focus({preventScroll:true})}catch(e){}}
}
$('#dlg-x').addEventListener('click',closeEditor);
$('#f-cancel').addEventListener('click',closeEditor);
overlay.addEventListener('mousedown',function(e){if(e.target===overlay) closeEditor()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!overlay.hidden) closeEditor()});

f.del.addEventListener('click',function(){
  if(!ed||!ed.id) return;
  if(!ed.armed){
    ed.armed=true;f.del.textContent='Pulsa de nuevo para eliminar';f.del.classList.add('armed');
    return;
  }
  var id=ed.id;
  closeEditor();
  removeTask(id);
});

form.addEventListener('submit',async function(e){
  e.preventDefault();
  if(!ed) return;
  var kind=ed.kind,id=ed.id;
  var title=f.title.value.trim(),date=f.date.value,subject=f.subject.value;
  if(!date&&kind!=='personal'){showErr('Elige una fecha.');f.date.focus();return}
  var data;
  if(kind==='personal'){
    if(!title){showErr('Escribe qué tienes que hacer.');f.title.focus();return}
    data={kind:'personal',title:title,date:date||'',subject:''};
  }else if(kind==='open'){
    if(!title){showErr('Escribe qué tienes que hacer.');f.title.focus();return}
    data={kind:'open',title:title,date:date,subject:subject};
  }else{
    var allday=f.allday.checked;
    var start=allday?'':f.start.value,end=allday?'':f.end.value;
    if(!allday&&!start){showErr('Indica la hora de inicio.');f.start.focus();return}
    if(!allday&&end&&end<=start){showErr('La hora de fin debe ser posterior a la de inicio.');f.end.focus();return}
    var s=subjectById(subject);
    if(!title&&!s){showErr('Escribe un título o elige una asignatura.');f.title.focus();return}
    data={kind:'org',title:title||s.name,date:date,subject:subject,color:getColor(),type:'',start:start,end:end};
  }
  if(kind!=='personal'){state.lastKind=kind;pref('kind',kind)}

  if(id){
    closeEditor();
    if(kind!=='personal') state.cursor=parseKey(date);
    await patch(id,data);
    render();
    return;
  }
  var weeks=1;
  if(kind==='org'&&f.rep.checked){
    weeks=Math.max(2,Math.min(40,parseInt(f.weeks.value,10)||15));
  }
  closeEditor();
  if(kind!=='personal') state.cursor=parseKey(date);
  var base=Date.now();
  for(var i=0;i<weeks;i++){
    await addTask(Object.assign({},data,{
      date:kind==='personal'?date:fmtKey(addDays(parseKey(date),7*i)),
      done:false,created:base+i
    }));
  }
  if(weeks>1) toast('Creadas '+weeks+' repeticiones semanales.');
  render();
});

/* ---------- Arranque ---------- */

/* Clave y cierre de sesión */
$('#clave-form').addEventListener('submit',function(e){
  e.preventDefault();
  var v=$('#clave-in').value.trim();
  if(!v){var er=$('#clave-err');er.textContent='Escribe tu clave.';er.hidden=false;return}
  pref('clave',v);
  $('#clave-in').value='';
  $('#clave-err').hidden=true;
  sync();
});
$('#logout').addEventListener('click',function(){
  if(outbox.size||gOutbox.size){toast('Hay cambios sin enviar. Espera a tener conexión antes de cerrar sesión.');return}
  pref('clave','');pref('tasks','[]');pref('grades','[]');pref('goutbox','[]');pref('gsync','');
  tasks.clear();grades=[];gDraft={id:null,subject:'',name:'',score:'',weight:''};net.status='clave';ready=true;
  render();openClave();
});

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
render();
startApp();
})();
</script>
</body>
</html>
